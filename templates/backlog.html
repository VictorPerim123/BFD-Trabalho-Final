<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SavePoint — Meu Backlog</title>
  <meta name="description" content="Gerencie seu backlog de jogos: status, notas e progresso de conquistas." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../static/css/reset.css" />
  <link rel="stylesheet" href="../static/css/main.css" />
  <link rel="stylesheet" href="../static/css/components.css" />
</head>
<body>
  <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>

  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        Save<span class="brand-accent">Point</span>
      </div>

      <nav class="main-nav" aria-label="Navegação principal">
        <a href="dashboard.html">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" focusable="false"><path fill="currentColor" d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"/></svg>
          </span>
          Dashboard
        </a>
        <a href="backlog.html" aria-current="page">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" focusable="false"><path fill="currentColor" d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z"/></svg>
          </span>
          Meu Backlog
        </a>
        <a href="run-form.html">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" focusable="false"><path fill="currentColor" d="M13 2L3 14h6l-1 8 11-14h-7z"/></svg>
          </span>
          Registrar Run
        </a>
        <a href="builds.html">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" focusable="false"><path fill="currentColor" d="M22 6.5a4.5 4.5 0 01-6.36 4.1L9.5 16.7a2 2 0 11-2.83-2.83l6.1-6.14A4.5 4.5 0 1122 6.5z"/></svg>
          </span>
          Minhas Builds
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="login.html">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" focusable="false"><path fill="currentColor" d="M10 3v2H5v14h5v2H3V3zM16.17 12l-3.58-3.59L14 7l6 5-6 5-1.41-1.41L16.17 13H9v-1z"/></svg>
          </span>
          Sair
        </a>
      </div>
    </aside>

    <main class="app-main" id="conteudo-principal">
      <header class="page-topbar">
        <h1>Meu Backlog</h1>
        <div class="topbar-actions">
          <button type="button" class="btn btn-primary" id="btn-add-game">+ Adicionar jogo</button>
        </div>
      </header>

      <form class="filters-bar" role="search" aria-label="Filtrar backlog" onsubmit="return false;">
        <label for="search-input" class="visually-hidden">Buscar jogo pelo título</label>
        <input type="search" id="search-input" placeholder="Buscar jogo…" />

        <label for="status-filter" class="visually-hidden">Filtrar por status</label>
        <select id="status-filter">
          <option value="">Status: todos</option>
          <option value="quero_jogar">Quero Jogar</option>
          <option value="jogando">Jogando</option>
          <option value="zerado">Zerado</option>
          <option value="platinado">Platinado</option>
          <option value="abandonado">Abandonado</option>
        </select>

        <label for="category-filter" class="visually-hidden">Filtrar por categoria</label>
        <select id="category-filter">
          <option value="">Categoria: todas</option>
        </select>
      </form>

      <section class="card" id="game-form-card" hidden aria-labelledby="game-form-title" style="margin-bottom: var(--space-6);">
        <h2 id="game-form-title">Adicionar jogo</h2>
        <form id="game-form">
          <div class="field">
            <label for="game-titulo">Título do jogo</label>
            <input type="text" id="game-titulo" name="titulo" required />
          </div>

          <div class="field" style="display:grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">
            <div>
              <label for="game-status">Status</label>
              <select id="game-status" name="status">
                <option value="quero_jogar">Quero Jogar</option>
                <option value="jogando">Jogando</option>
                <option value="zerado">Zerado</option>
                <option value="platinado">Platinado</option>
                <option value="abandonado">Abandonado</option>
              </select>
            </div>
            <div>
              <label for="game-nota">Nota pessoal (0–10)</label>
              <input type="number" id="game-nota" name="nota" min="0" max="10" step="0.1" />
            </div>
          </div>

          <div class="field">
            <label for="game-categorias">Categorias</label>
            <input type="text" id="game-categorias" name="categorias" placeholder="Ex: RPG, Roguelike" />
            <p class="hint">Separe múltiplas categorias por vírgula.</p>
          </div>

          <div class="topbar-actions">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <button type="button" class="btn btn-ghost" id="btn-cancel-form">Cancelar</button>
          </div>
        </form>
      </section>

      <section aria-labelledby="titulo-grid">
        <h2 id="titulo-grid" class="visually-hidden">Lista de jogos do backlog</h2>
        <div class="games-grid" id="games-grid"></div>
        <p class="empty-state" id="empty-state" hidden>
          Nenhum jogo encontrado com os filtros atuais.
        </p>
      </section>
    </main>
  </div>

  <div id="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script src="../static/js/api.js"></script>
  <script src="../static/js/ui.js"></script>
  <script src="../static/js/backlog.js"></script>
</body>
</html>
