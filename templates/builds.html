{% extends "base.html" %}

{% block title %}Minhas Builds{% endblock %}

{% block content %}
  <header class="page-topbar">
    <h1>Minhas Builds</h1>
    <div class="topbar-actions">
      <button type="button" class="btn btn-primary" id="btn-add-build">+ Nova build</button>
    </div>
  </header>

  <section class="card" id="build-form-card" hidden aria-labelledby="build-form-title" style="margin-bottom: var(--space-6);">
    <h2 id="build-form-title">Nova anotação de build</h2>
    <form id="build-form">
      <div class="field">
        <label for="build-jogo">Jogo</label>
        <select id="build-jogo" name="jogo_id" required>
          <option value="">Carregando jogos…</option>
        </select>
      </div>
      <div class="field">
        <label for="build-nome">Nome da build</label>
        <input type="text" id="build-nome" name="nome_build" required placeholder="Ex: Mago Elemental" />
      </div>
      <div class="field">
        <label for="build-equipamento">Equipamento</label>
        <textarea id="build-equipamento" name="detalhes_equipamento" placeholder="Itens equipados"></textarea>
      </div>
      <div class="field">
        <label for="build-habilidades">Habilidades</label>
        <textarea id="build-habilidades" name="habilidades" placeholder="Distribuição de skills e talentos"></textarea>
      </div>
      <div class="topbar-actions">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <button type="button" class="btn btn-ghost" id="btn-cancel-build-form">Cancelar</button>
      </div>
    </form>
  </section>

  <section aria-labelledby="titulo-builds">
    <h2 id="titulo-builds" class="visually-hidden">Anotações de build por jogo</h2>
    <div class="builds-grid" id="builds-grid"></div>
    <p class="empty-state" id="empty-state" hidden>
      Você ainda não registrou nenhuma build.
    </p>
  </section>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
  <script src="{{ url_for('static', filename='js/builds.js') }}"></script>
{% endblock %}
