{% extends "base.html" %}

{% block title %}Registrar Run{% endblock %}

{% block content %}
  <header class="page-topbar">
    <h1 id="run-page-title">Registrar Nova Run</h1>
  </header>

  <form id="run-form" class="card" style="max-width: 420px;" novalidate>
    <div class="field">
      <label for="run-jogo">Selecionar jogo</label>
      <select id="run-jogo" name="jogo" required aria-describedby="erro-jogo">
        <option value="">Carregando jogos…</option>
      </select>
      <p class="error-message" id="erro-jogo" role="alert"></p>
    </div>

    <div class="field">
      <label for="run-data">Data da run</label>
      <input type="date" id="run-data" name="data" required aria-describedby="erro-data" />
      <p class="error-message" id="erro-data" role="alert"></p>
    </div>

    <div class="field">
      <label for="run-tempo">Tempo de duração</label>
      <input type="text" id="run-tempo" name="tempo" inputmode="numeric" maxlength="12" placeholder="00:25:30" required aria-describedby="dica-tempo erro-tempo" />
      <p class="hint" id="dica-tempo">Formato HH:MM:SS ou MM:SS; horas podem ultrapassar 24.</p>
      <p class="error-message" id="erro-tempo" role="alert"></p>
    </div>

    <fieldset class="toggle-group" aria-describedby="erro-resultado">
      <legend>Resultado</legend>
      <label class="toggle-option">
        <input type="radio" name="resultado" value="vitoria" required />
        <span>Vitória</span>
      </label>
      <label class="toggle-option">
        <input type="radio" name="resultado" value="derrota" required />
        <span>Derrota</span>
      </label>
    </fieldset>
    <p class="error-message" id="erro-resultado" role="alert"></p>

    <div class="field" id="causa-morte-wrapper" hidden>
      <label for="run-causa-morte">Observações / causa da morte</label>
      <textarea id="run-causa-morte" name="causa_morte" maxlength="200" placeholder="Ex: Delirium na Cave"></textarea>
    </div>

    <button type="submit" class="btn btn-primary btn-block" id="run-submit">Salvar Run</button>
  </form>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
  <script src="{{ url_for('static', filename='js/run-form.js') }}"></script>
{% endblock %}
