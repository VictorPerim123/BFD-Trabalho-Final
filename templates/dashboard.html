{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
  <header class="page-topbar">
    <h1>Dashboard</h1>
  </header>

  <section aria-labelledby="titulo-estatisticas">
    <h2 id="titulo-estatisticas" class="visually-hidden">Estatísticas gerais</h2>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="stat-zerados">—</div>
        <div class="stat-label">Jogos zerados</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-horas">—</div>
        <div class="stat-label">Tempo acumulado</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-nota">—</div>
        <div class="stat-label">Nota média</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-runs">—</div>
        <div class="stat-label">Runs registradas</div>
      </div>
    </div>
  </section>

  <section aria-labelledby="titulo-jogando">
    <h2 id="titulo-jogando">Jogando agora</h2>
    <ul class="recent-list" id="recent-games-list">
      <li>Carregando…</li>
    </ul>
  </section>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
