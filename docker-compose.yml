services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: savepoint
      POSTGRES_PASSWORD: savepoint
      POSTGRES_DB: savepoint
    ports:
      - "5432:5432"
    volumes:
      - savepoint_pgdata:/var/lib/postgresql/data

volumes:
  savepoint_pgdata:
