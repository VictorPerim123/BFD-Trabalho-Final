services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: savepoint
      POSTGRES_PASSWORD: savepoint
      POSTGRES_DB: savepoint
    ports:
      - "5432:5432"
    volumes:
      - savepoint_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savepoint"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://savepoint:savepoint@db:5432/savepoint
      SECRET_KEY: ${SECRET_KEY:-}
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
    ports:
      - "5000:5000"

volumes:
  savepoint_pgdata:
